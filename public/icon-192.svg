<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>

  <!-- Subtle glow -->
  <circle cx="96" cy="30" r="80" fill="white" opacity="0.08"/>

  <!-- Clipboard Board -->
  <rect x="42" y="44" width="108" height="114" rx="16" fill="url(#boardGrad)" filter="url(#shadow)"/>

  <!-- Clip top -->
  <rect x="74" y="34" width="44" height="20" rx="8" fill="#1e40af"/>
  <rect x="84" y="30" width="24" height="10" rx="4" fill="#93c5fd"/>

  <!-- Checklist lines and checkmarks -->
  <!-- Row 1 (Checked) -->
  <rect x="56" y="68" width="18" height="18" rx="5" fill="#22c55e"/>
  <path d="M60.5 77 L64 80.5 L69.5 74" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="82" y="73" width="54" height="8" rx="4" fill="#64748b"/>

  <!-- Row 2 (Checked) -->
  <rect x="56" y="96" width="18" height="18" rx="5" fill="#3b82f6"/>
  <path d="M60.5 105 L64 108.5 L69.5 102" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="82" y="101" width="46" height="8" rx="4" fill="#64748b"/>

  <!-- Row 3 (In progress / dot) -->
  <rect x="56" y="124" width="18" height="18" rx="5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="82" y="129" width="36" height="8" rx="4" fill="#94a3b8"/>
</svg>
